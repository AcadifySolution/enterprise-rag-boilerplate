[tool.poetry]
name = "enterprise-rag-boilerplate"
version = "0.1.0"
description = "Reference retrieval-augmented generation backend with metadata filtering and asynchronous ingestion"
authors = ["Acadify Solution <contact@acadifysolution.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = {version = "^2.0.28", extras = ["asyncio"]}
pgvector = "^0.2.5"
asyncpg = "^0.29.0"
pinecone = "^6.0.0"
qdrant-client = "^1.8.0"
langchain = "^0.1.12"
langchain-core = "^0.1.32"
langchain-community = "^0.0.28"
langchain-anthropic = "^0.1.4"
tiktoken = "^0.6.0"
numpy = "^1.26.4"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"
ruff = "^0.3.3"
black = "^24.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.black]
line-length = 100
target-version = ['py311']
